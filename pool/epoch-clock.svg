<!-- slot pilot lamp -->
<circle cx="512" cy="262" r="6" fill="#ffdf42">
<animate attributeName="fill" values="#ffdf42;#ffdf42;#2ee6e2;#2ee6e2;#ffdf42" keyTimes="0;.45;.5;.95;1" dur="2s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;.2;1;.2;1" dur="2s" repeatCount="indefinite"/>
</circle>
<!-- hands: epoch (yellow, 432000s), day (cyan, 86400s), sweep (60s) -->

<style>
  :root{--bg:#101012;--panel:#18181c;--line:#2a2a31;--ink:#eceaea;--dim:#9a9aa4;
        --red:#ed1c24;--gold:#c9a227;--ok:#4ade80;--warn:#fbbf24}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:28px 18px 64px}
  a{color:#7dd3fc}
  /* NB: never text-transform the series name — the capital CH is the point */
  .kicker{font:700 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.18em;
          color:var(--gold);margin-bottom:9px}
  .kicker a{color:var(--gold);text-decoration:none}
  .kicker a:hover{text-decoration:underline}
  h1{font:900 clamp(34px,9vw,58px)/1 ui-sans-serif,system-ui,sans-serif;
     letter-spacing:-.03em;margin:0}
  .sub{color:var(--dim);margin:6px 0 22px;font-size:15px}
  .clock{display:flex;gap:8px;justify-content:center;margin:20px 0 6px}
  .clock div{background:var(--panel);border:1px solid var(--line);border-radius:10px;
             padding:8px 0;min-width:66px;text-align:center}
  .clock b{display:block;font:800 24px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .clock span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .deadline{text-align:center;color:var(--dim);font-size:13px;margin-bottom:22px}
  footer{margin-top:30px;color:var(--dim);font-size:12.5px;text-align:center}
  .hint{margin:11px 2px 0;font-size:13px;line-height:1.5;color:var(--dim);text-align:center}
  .hint b{color:#c9c9d2;font-weight:700}
  .hint[hidden]{display:none}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .card{position:relative;border:1.5px solid #8a6a25;border-radius:11px;overflow:hidden;
        background:#232326;display:block;text-decoration:none}
  .card .pic{width:100%;aspect-ratio:1;display:block}
  .card.lock .pic{filter:grayscale(1) brightness(.42) blur(3px)}
  .card.lock::after{content:'';position:absolute;left:0;right:0;top:0;bottom:26px;
                    background:rgba(12,12,14,.72)}
  .card .q{position:absolute;left:0;right:0;top:0;bottom:26px;display:grid;place-items:center;
           z-index:2;font:900 clamp(24px,6.5vw,42px)/1 ui-sans-serif,system-ui,sans-serif;
           color:#f4f4f4;text-shadow:0 2px 10px #000}
  .card .cap{height:26px;background:#0b0b0c;color:var(--gold);text-align:center;
             font:700 11px/26px ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em}
  .card.open{border-color:#e6c25a;box-shadow:0 0 0 1px rgba(230,194,90,.35),0 8px 26px -12px #000}
  .card.open:hover{border-color:#ffd970;transform:translateY(-2px)}
  .card.open{transition:transform .12s ease,border-color .12s ease}
  .live{position:absolute;z-index:3;left:0;right:0;bottom:26px;padding:6px 3px;
        background:linear-gradient(transparent,rgba(8,8,9,.92) 42%);text-align:center}
  .live b{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;
          border-radius:999px;padding:4px 9px;white-space:nowrap;
          font:800 clamp(9px,2.5vw,11px)/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.06em}
  .live b::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;
                  animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .live i{display:block;margin-top:5px;font-style:normal;color:#e9e9ee;white-space:nowrap;
          font:700 clamp(9px,2.4vw,11px)/1 ui-monospace,monospace;font-variant-numeric:tabular-nums}

  h1{margin-bottom:2px}
  .sub{margin:9px 0 0;font-size:15.5px;line-height:1.5}
  .sub b{color:var(--ink);font-weight:700}
  .grid{margin-top:18px}
</style>
</head>
<body>
<div class="wrap">

  <div class="kicker">a series of nine</div>
  <h1 style="color:var(--gold)">oligarCH</h1>
  <!-- ONE line. The manifesto that used to sit here was deliberately stripped on
       2026-07-28 to keep the landing art-forward; do not grow this back into copy. -->
  <p class="sub">Each picture lives <b>entirely inside its minting transaction</b> — no IPFS,
     no server, nothing to keep alive. You pay the network fee; the creator takes nothing.</p>

  <div class="grid" id="grid"></div>
  <p class="deadline" style="margin-top:14px" id="tally">&nbsp;</p>
  <p class="hint" id="nowallet" hidden>To mint, open this in a wallet's dapp browser —
     <b>Vespr</b> on a phone, or the <b>Eternl</b> extension on desktop.</p>

</div>

<script type="module">
const ANCHOR_SLOT = 193727336, ANCHOR_UNIX = 1785293627;
const ARTS = {}, B64 = {};
for (const el of document.querySelectorAll('script[data-art]')) {
  const b = btoa(String.fromCharCode(...new TextEncoder().encode(el.textContent.trim())));
  B64[el.dataset.art] = b;
  ARTS[el.dataset.art] = 'data:image/svg+xml;base64,' + b;
}
const $ = id => document.getElementById(id);
const nowSlot = () => ANCHOR_SLOT + Math.floor(Date.now() / 1000) - ANCHOR_UNIX;
const pad = n => String(n).padStart(2, '0');
function parts(slot) {
  let s = slot - nowSlot(); if (s < 0) s = 0;
  return [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60, s];
}
const hasWallet = () => {
  const c = window.cardano || {};
  return Object.keys(c).some(k => c[k] && typeof c[k].enable === 'function' && c[k].apiVersion);
};
// Extensions inject window.cardano AFTER load, so a bare check would flash the hint at
// desktop users who do have a wallet. Poll ~3s, then conclude.
async function walletHint() {
  for (let i = 0; i < 30; i++) {
    if (hasWallet()) return true;
    await new Promise(r => setTimeout(r, 100));
  }
  const el = $('nowallet'); if (el) el.hidden = false;
  return false;
}
const PIECES = [{"n": 1, "slug": "byttg", "ticker": "BYTTG", "slot": 194598909, "phrase": "BURN YOU TO THE GROUND"}, {"n": 2, "slug": "tgm", "ticker": "TGM", "slot": 194654146, "phrase": "THE GREAT MIGRATION"}];
const VEIL = ARTS["byttg"];

const g = $('grid'), boxes = [];
for (let i = 0; i < 9; i++) {
  const p = PIECES.find(x => x.n === i + 1);
  const live = p && nowSlot() < p.slot;
  const c = document.createElement(live ? 'a' : 'div');
  c.className = 'card ' + (live ? 'open' : 'lock');
  if (live) { c.href = './' + p.slug + '/'; c.title = p.ticker + ' — ' + p.phrase + ' — minting now'; }
  c.innerHTML =
    `<img class="pic" src="${live ? ARTS[p.slug] : VEIL}" alt="${
       live ? p.ticker + ' — ' + p.phrase + ' — minting now' : 'unrevealed'}">`
    + (live ? `<div class="live"><b>MINTING NOW</b><i data-slot="${p.slot}"></i></div>`
            : '<div class="q">?</div>')
    + `<div class="cap">${p ? p.ticker + (live ? ' \u00b7 ' + p.n + ' of 9' : ' \u00b7 closed')
                            : 'oligarCH'}</div>`;
  g.appendChild(c);
  boxes.push({ el: c, p, live });
}
// Several windows can be open at once, each closing at its own slot, so every box
// carries its own deadline rather than the page holding a single one.
function tick() {
  let open = 0;
  for (const b of boxes) {
    if (!b.live) continue;
    const [d, h, m, s, left] = parts(b.p.slot);
    if (left) {
      open++;
      b.el.querySelector('i[data-slot]').textContent =
        `${d}d ${pad(h)}:${pad(m)}:${pad(s)} left`;
    } else {
      b.live = false;
      b.el.className = 'card lock';
      b.el.removeAttribute('href');
      b.el.querySelector('.live').outerHTML = '<div class="q">?</div>';
      b.el.querySelector('.cap').textContent = b.p.ticker + ' \u00b7 closed';
      b.el.querySelector('.pic').src = VEIL;
    }
  }
  const bits = [];
  if (open) bits.push(open + ' live');
  if (PIECES.length - open) bits.push((PIECES.length - open) + ' closed');
  if (9 - PIECES.length) bits.push((9 - PIECES.length) + ' not announced');
  $('tally').textContent = bits.join(' \u00b7 ');
}
tick(); setInterval(tick, 1000);
walletHint();

</script>

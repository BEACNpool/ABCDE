name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements/base.txt

      - name: Build the genesis database
        run: python scripts/build_genesis_db.py

      - name: Smoke-test read-only query (seeds must exist and be non-empty)
        run: |
          python - <<'PY'
          from mcp_server.readonly import run_select, assert_read_only, UnsafeSQLError
          r = run_select("SELECT count(*) AS n FROM seeds")
          n = r["rows"][0][0]
          assert n > 0, f"seeds table is empty (n={n})"
          print(f"seeds rows: {n}")
          # read-only guard must reject writes / multi-statements
          for bad in ["DROP TABLE seeds", "UPDATE seeds SET label='x'", "SELECT 1; SELECT 2"]:
              try:
                  assert_read_only(bad)
                  raise SystemExit(f"guard failed to block: {bad}")
              except UnsafeSQLError:
                  pass
          print("read-only guard OK")
          PY

      - name: Assert MCP server module imports
        run: python -c "import mcp_server.server as s; assert s.mcp.name == 'abcde-genesis'; print('MCP server import OK')"

      - name: Self-test (DB + read-only guard + MCP server + CLI imports)
        run: python scripts/selftest.py

      - name: Match scoreboard unit tests
        run: python -m unittest discover -s tests -p 'test_match_snapshot.py'

      - name: Verify static web pages
        run: python scripts/verify_web_pages.py

      - name: Verify public claim receipts
        run: python scripts/verify_claim_receipts.py

      - name: Verify IOGP/voucher follow-up receipts
        run: python scripts/verify_iogp_voucher_followup.py

      - name: Verify public artifact manifest
        run: python scripts/verify_public_artifacts.py

      - name: Verify founding-entity evidence and exact monetary arithmetic
        run: python scripts/verify_founding_evidence.py --db data/abcde_genesis.duckdb

      - name: Verify historical finding queries against the compact database
        run: python scripts/verify_finding_queries.py

      - name: Build release bundle
        run: python scripts/build_release_bundle.py

      - name: Structure verifier
        run: python scripts/verify.py --structure-only

      - name: Verify findings.json is current
        run: python scripts/build_findings_json.py --check

      - name: File-size policy guard
        run: python scripts/check_file_sizes.py
